# SonarCloud Automatic Analysis settings.
# Sources default to the whole repository, so the test directory has to be excluded
# from them as well as named in sonar.tests, or the analysis fails on overlapping paths.
# _generated is protoc/grpc_tools output: regenerated by
# mfiles-grpc/scripts/generate_stubs.py, never edited by hand.
sonar.exclusions=mfiles-grpc/src/mfiles_grpc/_generated/**,mfiles-grpc/tests/**
sonar.tests=mfiles-grpc/tests
sonar.python.version=3.10
